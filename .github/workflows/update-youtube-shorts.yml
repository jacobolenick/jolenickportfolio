name: Update YouTube Shorts

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-shorts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest Shorts
        run: node scripts/update-youtube-shorts.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/youtube-shorts.json
          if git diff --staged --quiet; then
            echo "No changes to YouTube shorts feed."
          else
            git commit -m "Update YouTube Shorts feed for About page."
            git push
          fi
