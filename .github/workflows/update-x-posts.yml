name: Update X posts

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-x-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest X posts
        env:
          X_API_BEARER: ${{ secrets.X_API_BEARER }}
        run: node scripts/update-x-posts.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/x-posts.json images/x/
          if git diff --staged --quiet; then
            echo "No changes to X feed."
          else
            git commit -m "Update X posts feed for About page."
            git push
          fi
